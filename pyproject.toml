[project]
name = "mars"
version = "0.1.0"
description = "MARS: BIST Piyasa Anomali ve Aciklanabilir Risk Skorlama Sistemi"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Ali Talip Semiz" },
  { name = "Mehmet Efe Aytas" },
  { name = "Kerem Taha Yurtlu" },
  { name = "Tamer Yilmaz" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pyarrow>=14.0",
  "yfinance>=0.2.40",
  "requests>=2.31",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30", "plotly>=5.18"]
nlp = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "tabulate>=0.9"]
all = ["mars[ui,nlp,dev]"]

[project.scripts]
mars-pipeline = "mars.cli:pipeline_cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
